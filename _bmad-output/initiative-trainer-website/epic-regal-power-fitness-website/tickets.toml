[[entry]]
id = 1
type = "story"
title = "Build and deploy the Home/Services tracer"
description = "Creates the shared Python/Jinja2/YAML-or-JSON/Pillow WebP pipeline, data contract, brand shell, and initial Home/About and Services & Classes pages on a Firebase preview; a person provisions and authenticates the preview project."
verify = "From a clean checkout, build and inspect the preview: Lynette, address, service towns, and phone field are selectable text; the Home action reaches Services; direct-contact copy, personal-training inquiry, group schedule, prices, allowances, and package policies match the source; and a source image produces WebP output."
covers = ["CAP-1", "CAP-2", "CAP-5"]
after = []
hitl = true
risk = "medium"
unknown = "A Firebase Hosting preview project and human deployment access are not configured."
references = ["_bmad-output/initiative-trainer-website/ux-personal-trainer-website/DESIGN.md", "_bmad-output/initiative-trainer-website/ux-personal-trainer-website/EXPERIENCE.md", "_bmad-output/initiative-trainer-website/ux-personal-trainer-website/mockups/key-home-about.html", "_bmad-output/initiative-trainer-website/ux-personal-trainer-website/mockups/key-services-classes.html"]

